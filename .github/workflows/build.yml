name: Programme bauen

# Baut die App für Windows, macOS und Linux. Die fertigen Dateien
# erscheinen im Lauf unter „Artifacts“. Bei einem Tag wie v1.0.0 werden sie
# zusätzlich an ein GitHub-Release gehängt.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            out: build/windows/x64/runner/Release
            file: Uebungsplaner-Windows.zip
          - os: macos-latest
            target: macos
            out: build/macos/Build/Products/Release
            file: Uebungsplaner-macOS.zip
          - os: ubuntu-latest
            target: linux
            out: build/linux/x64/release/bundle
            file: Uebungsplaner-Linux.tar.gz
          - os: ubuntu-latest
            target: apk
            out: build/app/outputs/flutter-apk
            file: Uebungsplaner-Android-Tablet.apk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux-Abhängigkeiten
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
        if: matrix.target != 'apk'
      - run: flutter build ${{ matrix.target }} --release
      - name: Packen (Windows)
        if: matrix.target == 'windows'
        run: 7z a "../${{ matrix.file }}" "./${{ matrix.out }}/*"
      - name: Packen (macOS)
        if: matrix.target == 'macos'
        run: ditto -c -k --keepParent "${{ matrix.out }}/uebungsplaner.app" "../${{ matrix.file }}"
      - name: Packen (Linux)
        if: matrix.target == 'linux'
        run: tar -czf "../${{ matrix.file }}" -C "${{ matrix.out }}" .
      - name: Packen (Android)
        if: matrix.target == 'apk'
        run: cp "${{ matrix.out }}/app-release.apk" "../${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
      - name: An Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}

  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            file: Uebungsplaner-Server-Linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            file: Uebungsplaner-Server-Linux-arm64-RaspberryPi.tar.gz
          - os: windows-latest
            file: Uebungsplaner-Server-Windows.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test
      - run: dart build cli -o build/cli
      - name: Packen
        run: |
          cp uebungsplaner-server.service build/cli/bundle/ 2>/dev/null || true
          cp README.md build/cli/bundle/
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../${{ matrix.file }}" ./build/cli/bundle/*; else tar -czf "../${{ matrix.file }}" -C build/cli/bundle .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
      - name: An Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen und veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/uebungsplaner-server:latest
            ghcr.io/${{ github.repository_owner }}/uebungsplaner-server:${{ github.sha }}
