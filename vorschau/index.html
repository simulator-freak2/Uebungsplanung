<title>Übungsplaner Vorschau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Flutter-artige App-Shell – Navigationsleiste links (unten auf schmalen Geräten), Arbeitsfläche rechts */
:root{
  --bg:#f7f4f2; --surface:#ffffff; --surface2:#f0ebe8; --line:#e2d9d4;
  --fg:#241c1a; --muted:#6c605b;
  --red:#c8102e; --red-ink:#ffffff; --red-soft:#fbe3e6;
  --yellow:#ffcc00; --yellow-ink:#2a2200; --yellow-soft:#fff5cc;
  --ok:#1f7a45; --ok-soft:#e1f3e8; --warn:#a85d00; --warn-soft:#fff0dc; --water:#4a90c2;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171312; --surface:#221c1b; --surface2:#2c2524; --line:#3d3433;
  --fg:#f3ecea; --muted:#b3a7a3;
  --red:#ff5a6e; --red-ink:#2a0007; --red-soft:#4a1a21;
  --yellow:#ffd633; --yellow-ink:#2a2200; --yellow-soft:#3f3510;
  --ok:#5fcf8c; --ok-soft:#173523; --warn:#ffb457; --warn-soft:#45300f; --water:#5aa6dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171312; --surface:#221c1b; --surface2:#2c2524; --line:#3d3433;
  --fg:#f3ecea; --muted:#b3a7a3;
  --red:#ff5a6e; --red-ink:#2a0007; --red-soft:#4a1a21;
  --yellow:#ffd633; --yellow-ink:#2a2200; --yellow-soft:#3f3510;
  --ok:#5fcf8c; --ok-soft:#173523; --warn:#ffb457; --warn-soft:#45300f; --water:#5aa6dc; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[draggable]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--red);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand b{font-family:var(--font-display);font-size:19px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
.navgrp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 12px 4px}
.navbtn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:999px;border:0;background:none;text-align:left;font-weight:500}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface2)}
.navbtn[aria-current="page"]{background:var(--red-soft);color:var(--red)}
.rail .spacer{flex:1}
.sync{font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:18px}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
h1{font-family:var(--font-display);font-size:30px;font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 0 10px;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.orgswitch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.orgswitch button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:13px}
.orgswitch button[aria-pressed="true"]{background:var(--red);color:var(--red-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn svg{width:16px;height:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.yel{background:var(--yellow-soft);color:var(--fg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.list{display:grid}
.row{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:11px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--surface2)}
.date{font-family:var(--font-display);text-align:center;line-height:1}
.date b{display:block;font-size:24px}
.date span{font-size:12px;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.month{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);min-height:110px}
.month h3{font-family:var(--font-display);font-size:16px;margin-bottom:8px}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--red);background:var(--surface2);border-radius:4px;padding:4px 7px;margin-bottom:5px;font-size:12px}
.ev.y{border-left-color:var(--yellow)} .ev.g{border-left-color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 11px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.phase{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.phase:first-child{border-top:0}
.phase .t{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.check input{margin-top:3px;accent-color:var(--red)}
/* Einteilung */
.board{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.pool{position:sticky;top:12px;display:grid;gap:8px;align-content:start;min-height:120px}
.pool.drop-ok,.seat.drop-ok{outline:2px dashed var(--red);outline-offset:2px}
.person{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);cursor:grab;user-select:none;text-align:left;width:100%}
.person b{font-weight:600;font-size:13px}
.person .q{font-size:11px;color:var(--muted);line-height:1.3}
.person[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.person.dragging{opacity:.4}
.vehicle{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.vehicle header{background:var(--red);color:var(--red-ink);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.vehicle header b{font-family:var(--font-display);font-size:17px}
.vehicle header select{font:inherit;font-size:12px;padding:3px 6px;border-radius:6px;border:0;background:var(--surface);color:var(--fg)}
.vehicle.lead header{background:var(--fg);color:var(--bg)}
.vbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px 0}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;padding:10px 12px 12px}
.seat{border:1px dashed var(--line);border-radius:8px;padding:6px;background:var(--surface2);min-height:66px;display:grid;gap:4px;align-content:start}
.seat .fn{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:0 2px}
.seat .fn i{font-style:normal;color:var(--red)}
.seat.warn{border:1px solid var(--warn);background:var(--warn-soft)}
.seat .why{font-size:11px;color:var(--warn);padding:0 2px}
.seat .empty{font-size:12px;color:var(--muted);padding:4px 2px}
/* Alarmplan */
.gantt{display:grid;gap:0;min-width:640px;padding-right:24px}
.grow{display:grid;grid-template-columns:200px 1fr;align-items:center;border-top:1px solid var(--line);min-height:44px}
.grow .glbl{font-weight:600;font-size:13px;padding-right:10px}
.grow .glbl small{display:block;font-weight:400;color:var(--muted)}
.track{position:relative;height:44px}
.seg{position:absolute;top:13px;height:18px;border-radius:4px}
.seg.prep{background:var(--yellow)}
.seg.drive{background:var(--red)}
.mark{position:absolute;top:8px;width:3px;height:28px;background:var(--fg);border-radius:2px}
.axis{position:relative;height:22px;margin-left:200px}
.axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* Rollenkarte */
.card-role{border:2px solid var(--fg);border-radius:10px;padding:16px;background:var(--surface);display:grid;gap:10px;position:relative}
.card-role .no{position:absolute;top:10px;right:14px;font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--red)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.esc{display:grid;gap:6px}
.esc div{display:grid;grid-template-columns:130px 1fr;gap:8px;border-left:4px solid var(--yellow);padding:4px 8px;background:var(--surface2);border-radius:0 6px 6px 0}
.esc div:nth-child(2){border-left-color:var(--warn)}
.esc div:nth-child(3){border-left-color:var(--red)}
.esc b{font-size:12px}
.esc small{display:block;color:var(--muted);font-size:11px}
/* Alarmmeldung */
.alarm{max-width:440px;border-radius:18px;border:1px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.alarm .ah{background:var(--red);color:var(--red-ink);padding:12px 16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.alarm .ah b{font-family:var(--font-display);font-size:22px;line-height:1.1}
.alarm .ub{background:var(--yellow);color:var(--yellow-ink);font-weight:700;letter-spacing:.14em;font-size:12px;text-align:center;padding:3px}
.alarm dl{margin:0;padding:12px 16px;display:grid;grid-template-columns:130px 1fr;gap:8px 12px}
.alarm dt{color:var(--muted);font-size:12px} .alarm dd{margin:0;font-weight:600}
/* Karte */
.mapwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2);position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.maptools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.notice{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:10px;padding:10px 14px;font-size:13px}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,td select,td input{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-checked="true"]{background:var(--red)}
.sw[aria-checked="true"]::after{left:21px}
.mode{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.modecard{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:left}
.modecard[aria-pressed="true"]{border-color:var(--red)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--font-display);font-size:28px;line-height:1}
.banner{background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.vlist{display:grid;gap:6px}
.vitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);text-align:left;display:grid;gap:2px}
.vitem[aria-current="true"]{border-color:var(--red);background:var(--red-soft)}
.vitem b{font-family:var(--font-display);font-size:17px}
.yes{color:var(--ok);font-weight:700}
.rate{display:flex;gap:4px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;min-width:30px}
.rate button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
@media (max-width:900px){
  .board,.split{grid-template-columns:1fr}
  .pool{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .pool h3,.pool p{grid-column:1/-1}
  .rk3{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .brand,.rail .spacer,.sync,.navgrp{display:none}
  .navbtn{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;border-radius:12px;flex:none}
  main{padding-bottom:96px}
  .kv,.alarm dl{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .row{grid-template-columns:52px 1fr}
  .row .chips{grid-column:2}
  .rk3{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <div class="panel"><div class="actions" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Funktionen & Besetzungsmuster</h2><div class="actions"><button class="btn sm">${ic('plus')}Funktion</button><button class="btn sm">${ic('plus')}Besetzungsmuster</button></div></div>
     <div class="tw"><table><thead><tr><th>Funktion</th><th>Benötigte Qualifikation</th>${pats.map(p=>`<th class="c">${p}</th>`).join('')}</tr></thead><tbody>
     ${v.fns.map(([f,q])=>`<tr><td><b>${f}</b></td><td>${q?`<span class="chip">${q}</span>`:'<span class="muted">–</span>'}</td>${pats.map(p=>`<td class="c">${v.patterns[p].includes(f)?'<span class="yes">✓</span>':'<span class="muted">·</span>'}</td>`).join('')}</tr>`).join('')}
     <tr><td class="muted">Sitzplätze</td><td></td>${pats.map(p=>`<td class="c num"><b>${v.patterns[p].length}</b></td>`).join('')}</tr></tbody></table></div></div>
    <div class="panel"><div class="actions" style="justify-content:space-between;margin-bottom:8px"><div><h2 style="margin:0">Führungs- und Sonderfunktionen</h2><span class="muted small">gelten für alle Übungen, unabhängig vom Fahrzeug</span></div><button class="btn sm">${ic('plus')}Funktion</button></div>
     <div class="tw"><table><thead><tr><th>Funktion</th><th>Benötigte Qualifikation</th></tr></thead><tbody>${d.lead.map(([f,q])=>`<tr><td><b>${f}</b></td><td>${q?`<span class="chip">${q}</span>`:'<span class="muted">–</span>'}</td></tr>`).join('')}</tbody></table></div></div>
   </div></div>`;
}

  const d=D();

  <div class="panel"><div class="tw"><table><thead><tr><th>Name</th><th>Personalnr.</th><th>Qualifikationen</th></tr></thead><tbody>
  ${d.members.map(m=>`<tr><td style="font-weight:600">${esc(m.n)}</td><td class="num">${m.p}</td><td><div class="chips">${m.q.map(q=>`<span class="chip">${esc(q)}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table></div></div>`;

const sw=(id,label,sub)=>`<div class="toggle"><div><b>${label}</b><div class="muted small">${sub}</div></div><button class="sw" role="switch" aria-checked="${S[id]}" data-sw="${id}" aria-label="${label}"></button></div>`;
function vEinst(){
  return head('Einstellungen','Nur für Administratoren')+`
  <div class="panel"><h2>Betriebsart</h2><div class="mode">
   <button class="modecard" data-mode="lokal" aria-pressed="${S.mode==='lokal'}"><b>Nur lokal</b><div class="muted small">Daten liegen auf diesem Gerät. Kein Server nötig.</div></button>
   <button class="modecard" data-mode="netz" aria-pressed="${S.mode==='netz'}"><b>Mit Server abgleichen</b><div class="muted small">Arbeiten auch ohne Verbindung, Abgleich sobald der Server erreichbar ist. Letzte Änderung gilt.</div></button></div>
   ${S.mode==='netz'?`<div class="grid2" style="margin-top:14px"><div class="field"><label for="srv">Serveradresse</label><input id="srv" value="https://192.168.178.20:8443"></div><div class="field"><label for="usr">Benutzer</label><input id="usr" value="admin"></div></div>`:''}</div>
  <div class="grid2">
   <div class="panel"><h2>Abläufe</h2>
    ${sw('freigabe','Freigabe von Übungen erforderlich','Übungen müssen von einem Admin freigegeben werden')}
    ${sw('remote','Zugriff von zu Hause über VPN','Server nimmt Verbindungen aus dem VPN-Netz an. Kein Port nach außen nötig.')}
    <div class="toggle"><div><b>Karten</b><div class="muted small">Offline-Karte: Landkreis Musterkreis (heruntergeladen)</div></div>
     <select id="maps" style="font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)">${['online','offline','beides'].map(o=>`<option ${S.maps===o?'selected':''}>${o}</option>`).join('')}</select></div>
   </div>
   <div class="panel"><h2>Materialkompass</h2>
    ${sw('mk','Anbindung an Materialkompass','Material und Fahrzeuge übernehmen')}
    ${S.mk?sw('res','Fahrzeuge direkt reservieren','Planer dürfen Fahrzeuge für Übungen in Materialkompass reservieren'):''}
    ${S.mk?`<div class="field" style="margin-top:8px"><label for="mkurl">Adresse</label><input id="mkurl" value="https://materialkompass.org/api/v1"></div><div class="field" style="margin-top:8px"><label for="mkkey">API-Schlüssel</label><input id="mkkey" type="password" value="xxxxxxxxxxxxxxxx"></div>`:''}
   </div>
  </div>
  <div class="grid2">
   <div class="panel"><h2>Benutzer & Rollen</h2><div class="tw"><table><thead><tr><th>Benutzer</th><th>Rolle</th></tr></thead><tbody>
    <tr><td>admin</td><td><span class="chip red">Administrator</span></td></tr><tr><td>j.becker</td><td><span class="chip yel">Planer / Ausbilder</span></td></tr><tr><td>l.schulz</td><td><span class="chip yel">Planer / Ausbilder</span></td></tr></tbody></table></div></div>
   <div class="panel"><h2>Geräte</h2><div class="tw"><table><thead><tr><th>Gerät</th><th>Zugriff</th><th>Letzter Abgleich</th></tr></thead><tbody>
    <tr><td>PC Gerätehaus (Windows)</td><td>Bearbeiten</td><td class="num">vor 2 Min.</td></tr><tr><td>Laptop Wehrführung (macOS)</td><td>Bearbeiten</td><td class="num">gestern</td></tr><tr><td>iPad Fahrzeughalle</td><td><span class="chip">Nur ansehen</span></td><td class="num">vor 1 Std.</td></tr><tr><td>Android-Tablet ELW</td><td><span class="chip">Nur ansehen</span></td><td class="num">vor 3 Tagen</td></tr></tbody></table></div></div>
  </div>`;

/* ================= Rendering & Interaktion ================= */
function render(){
  rail();
  const V={start:vStart,plan:vPlan,uebungen:vList,detail:vDetail,vorlagen:vVorlagen,fahrzeuge:vFahrzeuge,stichworte:vStichworte,personal:vPersonal,einst:vEinst};
  document.getElementById('view').innerHTML=V[S.view]();
}
function move(name,to){
  const e=EX();
  let fromKey=null;
  for(const [vid,a] of Object.entries(e.assign)) for(const [fn,p] of Object.entries(a.s)) if(p===name){fromKey=[vid,fn];delete a.s[fn];}
  if(to==='pool') return;
  const [vid,fn]=to.split('|'); const a=e.assign[vid]; const prev=a.s[fn];
  a.s[fn]=name;
  if(prev&&prev!==name&&fromKey) e.assign[fromKey[0]].s[fromKey[1]]=prev;
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-nav],[data-org],[data-open],[data-tab],[data-sw],[data-mode],[data-veh],[data-rate],[data-person],[data-drop]');if(!t)return;
  const ds=t.dataset; let scroll=false;
  if(ds.person){S.pick=S.pick===ds.person?null:ds.person;}
  else if(ds.drop){if(!S.pick)return;move(S.pick,ds.drop);S.pick=null;}
  else if(ds.nav){S.view=ds.nav;scroll=true;}
  else if(ds.org){S.org=ds.org;S.pick=null;try{localStorage.setItem('up-org',S.org)}catch(e){}}
  else if('open' in ds){if(!ds.open)return;S.view='detail';S.tab='plan';scroll=true;}
  else if(ds.tab){S.tab=ds.tab;}
  else if(ds.sw){S[ds.sw]=!S[ds.sw];}
  else if(ds.mode){S.mode=ds.mode;}
  else if(ds.veh){S.veh=ds.veh;}
  else if(ds.rate){const[i,v]=ds.rate.split('|');const r=S.rate[S.org]||(S.rate[S.org]={});r[i]=r[i]===v?null:v;}
  render(); if(scroll) window.scrollTo(0,0);
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='maps'){S.maps=ev.target.value;}
  if(ev.target.dataset.pat){EX().assign[ev.target.dataset.pat].pat=ev.target.value;render();}
});
document.addEventListener('dragstart',ev=>{const p=ev.target.closest('[data-person]');if(!p)return;ev.dataTransfer.setData('text/plain',p.dataset.person);ev.dataTransfer.effectAllowed='move';p.classList.add('dragging');});
document.addEventListener('dragend',ev=>{document.querySelectorAll('.dragging,.drop-ok').forEach(x=>x.classList.remove('dragging','drop-ok'));});
document.addEventListener('dragover',ev=>{const z=ev.target.closest('[data-drop]');if(!z)return;ev.preventDefault();document.querySelectorAll('.drop-ok').forEach(x=>x!==z&&x.classList.remove('drop-ok'));z.classList.add('drop-ok');});
document.addEventListener('drop',ev=>{const z=ev.target.closest('[data-drop]');if(!z)return;ev.preventDefault();const n=ev.dataTransfer.getData('text/plain');if(n){move(n,z.dataset.drop);S.pick=null;render();}});
render();
</script>
