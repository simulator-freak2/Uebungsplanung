<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">

/* Layout: Flutter-artige App-Shell – Navigationsleiste links (unten auf Tablet hochkant/Handy), Arbeitsfläche rechts */
:root{
  --bg:#f7f4f2; --surface:#ffffff; --surface2:#f0ebe8; --line:#e2d9d4;
  --fg:#241c1a; --muted:#6c605b;
  --red:#c8102e; --red-ink:#ffffff; --red-soft:#fbe3e6;
  --yellow:#ffcc00; --yellow-ink:#2a2200; --yellow-soft:#fff5cc;
  --ok:#1f7a45; --warn:#a85d00; --warn-soft:#fff0dc;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171312; --surface:#221c1b; --surface2:#2c2524; --line:#3d3433;
  --fg:#f3ecea; --muted:#b3a7a3;
  --red:#ff5a6e; --red-ink:#2a0007; --red-soft:#4a1a21;
  --yellow:#ffd633; --yellow-ink:#2a2200; --yellow-soft:#3f3510;
  --ok:#5fcf8c; --warn:#ffb457; --warn-soft:#45300f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171312; --surface:#221c1b; --surface2:#2c2524; --line:#3d3433;
  --fg:#f3ecea; --muted:#b3a7a3;
  --red:#ff5a6e; --red-ink:#2a0007; --red-soft:#4a1a21;
  --yellow:#ffd633; --yellow-ink:#2a2200; --yellow-soft:#3f3510;
  --ok:#5fcf8c; --warn:#ffb457; --warn-soft:#45300f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--red);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand b{font-family:var(--font-display);font-size:19px;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;border:0;background:none;text-align:left;font-weight:500}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface2)}
.navbtn[aria-current="page"]{background:var(--red-soft);color:var(--red)}
.rail .spacer{flex:1}
.sync{font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-family:var(--font-display);font-size:30px;font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.orgswitch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.orgswitch button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:13px}
.orgswitch button[aria-pressed="true"]{background:var(--red);color:var(--red-ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn svg{width:16px;height:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.yel{background:var(--yellow-soft);color:var(--fg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.list{display:grid;gap:0}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.date{font-family:var(--font-display);text-align:center;line-height:1}
.date b{display:block;font-size:24px}
.date span{font-size:12px;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,.num{font-variant-numeric:tabular-nums}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.month{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);min-height:110px}
.month h3{font-family:var(--font-display);font-size:16px;margin-bottom:8px}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--red);background:var(--surface2);border-radius:4px;padding:4px 7px;margin-bottom:5px;font-size:12px}
.ev.y{border-left-color:var(--yellow)}
.ev.g{border-left-color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--red);border-bottom-color:var(--red)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.phase{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.phase:first-child{border-top:0}
.phase .t{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:3px;accent-color:var(--red)}
.vehicle{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vehicle header{background:var(--red);color:var(--red-ink);padding:8px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vehicle header b{font-family:var(--font-display);font-size:17px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;padding:10px}
.seat{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)}
.seat .fn{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.seat.warn{border-color:var(--warn);background:var(--warn-soft)}
.seat .why{font-size:11px;color:var(--warn)}
.card-role{border:2px solid var(--fg);border-radius:10px;padding:14px;background:var(--surface);display:grid;gap:8px;position:relative}
.card-role .no{position:absolute;top:10px;right:12px;font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--red)}
.card-role .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fax{font-family:var(--font-mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:22px;max-width:640px;line-height:1.6;white-space:pre-wrap;overflow-x:auto}
.fax .stamp{display:inline-block;border:3px solid var(--red);color:var(--red);padding:2px 10px;font-weight:600;transform:rotate(-4deg);margin-bottom:8px;letter-spacing:.1em}
.mapwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2);position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.maptools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.notice{background:var(--yellow-soft);border:1px solid var(--yellow);border-radius:10px;padding:10px 14px;font-size:13px}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-checked="true"]{background:var(--red)}
.sw[aria-checked="true"]::after{left:21px}
.mode{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.modecard{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:left}
.modecard[aria-pressed="true"]{border-color:var(--red)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--font-display);font-size:28px;line-height:1}
.banner{background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.rail{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .brand,.rail .spacer,.sync{display:none}
  .navbtn{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;border-radius:12px}
  main{padding-bottom:96px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .row{grid-template-columns:52px 1fr}
  .row .chips{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav.rail,.topbar .btn,.tabs{display:none}}
</style>

   <div class="panel"><h2>Server</h2>
    ${sw('remote',S.remote,'Zugriff von außerhalb erlauben','Erreichbar von zu Hause. Nur über HTTPS, Admin entscheidet.')}
    ${sw('mk',S.mk,'Materialkompass-Anbindung','Geräte und Fahrzeuge aus der Materialverwaltung übernehmen')}
    <div class="toggle"><div><b>Karten</b><div class="muted" style="font-size:12px">Online, offline oder beides</div></div>
      <select id="maps" style="font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)">
       ${['online','offline','beides'].map(o=>`<option ${S.maps===o?'selected':''}>${o}</option>`).join('')}</select></div>
   </div>
   <div class="panel"><h2>Benutzer & Rollen</h2><div class="tw"><table><thead><tr><th>Benutzer</th><th>Rolle</th><th>Anmeldung</th></tr></thead><tbody>
    <tr><td>admin</td><td><span class="chip red">Administrator</span></td><td>lokales Konto</td></tr>
    <tr><td>j.becker</td><td><span class="chip yel">Planer / Ausbilder</span></td><td>lokales Konto</td></tr>
    <tr><td>l.schulz</td><td><span class="chip yel">Planer / Ausbilder</span></td><td>Vereins-/Firmenkonto (offen)</td></tr></tbody></table></div></div>
  </div>
  <div class="panel"><h2>Organisationsprofil</h2><p class="muted" style="margin:0 0 10px">Legt Begriffe, Funktionen und Qualifikationskataloge fest.</p>
   <div class="chips">${['Feuerwehr','DLRG','THW','DRK','ASB','Wasserwacht','JUH','MHD'].map((o,i)=>`<span class="chip ${i<2?'red':''}">${o}${i>1?' (später)':''}</span>`).join('')}</div></div>`;
}

function render(){
  rail();
  const V={start:vStart,plan:vPlan,uebungen:vList,detail:vDetail,vorlagen:vVorlagen,personal:vPersonal,einst:vEinst};
  document.getElementById('view').innerHTML=V[S.view]();
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-nav],[data-org],[data-open],[data-tab],[data-sw],[data-mode]'); if(!t) return;
  if(t.dataset.nav){S.view=t.dataset.nav;}
  else if(t.dataset.org){S.org=t.dataset.org;try{localStorage.setItem('up-org',S.org)}catch(e){}}
  else if('open' in t.dataset){ if(t.dataset.open){S.view='detail';S.tab='plan';} else return; }
  else if(t.dataset.tab){S.tab=t.dataset.tab;}
  else if(t.dataset.sw){S[t.dataset.sw]=!S[t.dataset.sw];}
  else if(t.dataset.mode){S.mode=t.dataset.mode;}
  render(); if(!t.dataset.tab&&!t.dataset.sw) window.scrollTo(0,0);
});
document.addEventListener('change',ev=>{if(ev.target.id==='maps'){S.maps=ev.target.value;}});
render();
</script>
